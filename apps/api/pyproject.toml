[project]
name = "profligator-api"
version = "0.1.0"
description = "Backend API and profile connectors for Profligator"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=6,<7",
  "rq>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:'asyncio.get_event_loop_policy'.*:DeprecationWarning:pytest_asyncio.plugin",
  "ignore:'asyncio.set_event_loop_policy'.*:DeprecationWarning:pytest_asyncio.plugin",
]

[tool.ruff]
line-length = 100
target-version = "py312"
