# Apply with compose.production.yaml; only this proxy publishes public ports.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PROFLIGATOR_DOMAIN: ${PROFLIGATOR_DOMAIN:?Set PROFLIGATOR_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  caddy-data:
  caddy-config:
